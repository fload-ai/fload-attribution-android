name: Publish to Maven Central

# Uploads com.fload:attribution:<tag> to the Sonatype Central Portal, signed,
# and the portal releases it once it validates (automaticRelease = true).
# The release gate is the approval of the maven-central environment, given
# per version. Off until the repository variable MAVEN_CENTRAL_ENABLED is
# "true"; see PUBLISHING.md for the one-time setup.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. 1.1.0. Run the workflow on that same tag (Use workflow from > Tags)."
        required: true

permissions:
  contents: read

concurrency:
  group: maven-central
  cancel-in-progress: false

jobs:
  # Outside the environment, so a wrong run fails here with a clear message
  # before anyone is asked to approve it. The maven-central environment only
  # accepts tags, and the version approved must be the version published.
  check-ref:
    if: vars.MAVEN_CENTRAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: The run is on the tag it publishes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::This run is on $GITHUB_REF_TYPE $GITHUB_REF_NAME but would publish $TAG. Run it on the tag: gh workflow run publish.yml --ref $TAG -f tag=$TAG"
            exit 1
          fi

  publish:
    needs: check-ref
    runs-on: ubuntu-latest
    # Holds the secrets and the release gate: a required reviewer approves each version.
    environment: maven-central
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag and the SDK version agree
        run: ./gradlew :attribution:verifySdkVersion -Pversion="$TAG"

      - name: Unit tests
        run: ./gradlew :attribution:testDebugUnitTest -Pversion="$TAG"

      - name: Sign, upload and release on the Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            [ -n "${!name}" ] || { echo "::error::$name is empty: set the maven-central environment's secrets (PUBLISHING.md)"; exit 1; }
          done
          ./gradlew :attribution:publishToMavenCentral -Pversion="$TAG" --no-configuration-cache
          echo "Uploaded com.fload:attribution:$TAG; the portal releases it once it validates. Follow it on https://central.sonatype.com/publishing/deployments" >> "$GITHUB_STEP_SUMMARY"
