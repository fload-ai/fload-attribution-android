name: Version

# The version every install reports (SdkInfo.VERSION) is VERSION, and a
# release tag is VERSION too.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: A tag is the release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [ "$GITHUB_REF_NAME" = "$(tr -d '[:space:]' < VERSION)" ] \
            || { echo "::error::tag $GITHUB_REF_NAME but VERSION is $(cat VERSION)"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (VersionTest holds SdkInfo.VERSION to VERSION)
        run: ./gradlew :attribution:testDebugUnitTest
