name: Kotlin Multiplatform sample

on:
  pull_request:
    paths: ["samples/kotlin-multiplatform/**", "attribution/**", ".github/workflows/kmp-sample.yml"]
  push:
    branches: [main]
    paths: ["samples/kotlin-multiplatform/**", "attribution/**", ".github/workflows/kmp-sample.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Android app
        run: ./gradlew -p samples/kotlin-multiplatform :androidApp:assembleDebug

      # arm64 only: the shared module builds iosSimulatorArm64, not the Intel simulator.
      - name: iOS app (simulator, builds the Shared framework through Gradle)
        run: |
          xcodebuild -project samples/kotlin-multiplatform/iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd ARCHS=arm64 build
